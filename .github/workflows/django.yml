name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12"]
        dj-version: ["3.2.*", "4.0.*", "4.1.*", "4.2.*", "5.0.*", "5.1.*", "5.2.*"]
        drf-version: ["3.11.*", "3.12.*", "3.13.*", "3.14.*", "3.15.*", "3.16.*", "3.17.*"]
        exclude:
        - dj-version: '4.0.*'
          drf-version: '3.11.*'
        - dj-version: '4.0.*'
          drf-version: '3.12.*'
        - dj-version: '4.1.*'
          drf-version: '3.11.*'
        - dj-version: '4.1.*'
          drf-version: '3.12.*'
        - dj-version: '4.2.*'
          drf-version: '3.11.*'
        - dj-version: '4.2.*'
          drf-version: '3.12.*'
        - dj-version: '4.2.*'
          drf-version: '3.13.*'
        - dj-version: '5.0.*'
          python-version: 3.9
        - dj-version: '5.1.*'
          python-version: 3.9
        - dj-version: '5.2.*'
          python-version: 3.9
        - dj-version: '5.0.*'
          drf-version: '3.11.*'
        - dj-version: '5.0.*'
          drf-version: '3.12.*'
        - dj-version: '5.0.*'
          drf-version: '3.13.*'
        - dj-version: '5.1.*'
          drf-version: '3.11.*'
        - dj-version: '5.1.*'
          drf-version: '3.12.*'
        - dj-version: '5.1.*'
          drf-version: '3.13.*'
        - dj-version: '5.2.*'
          drf-version: '3.11.*'
        - dj-version: '5.2.*'
          drf-version: '3.12.*'
        - dj-version: '5.2.*'
          drf-version: '3.13.*'
        - dj-version: '5.2.*'
          drf-version: '3.14.*'
        - dj-version: '5.2.*'
          drf-version: '3.15.*'
        - dj-version: '3.2.*'
          drf-version: '3.16.*'
        - dj-version: '4.0.*'
          drf-version: '3.16.*'
        - dj-version: '4.1.*'
          drf-version: '3.16.*'
        - dj-version: '3.2.*'
          drf-version: '3.17.*'
        - dj-version: '4.0.*'
          drf-version: '3.17.*'
        - dj-version: '4.1.*'
          drf-version: '3.17.*'
        - python-version: 3.9
          drf-version: '3.17.*'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install 'django==${{ matrix.dj-version }}' 'djangorestframework==${{ matrix.drf-version }}'
    - name: Run Tests
      run: |
        DATABASE_URL=psql://postgres:postgres@127.0.0.1:5432/github_actions coverage run -p runtests.py
        DATABASE_URL=psql://postgres:postgres@127.0.0.1:5432/github_actions coverage run -p manage.py behave
        coverage combine
        coverage report
    - name: Upload coverage data to coveralls.io
      run: coveralls --service=github
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ join(matrix.*, '-') }}
        COVERALLS_PARALLEL: true
  coveralls:
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
    - name: Finished
      run: |
        pip3 install --upgrade coveralls
        coveralls --service=github --finish
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
